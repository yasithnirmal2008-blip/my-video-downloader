<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <div class="header">
                <i class="fa-solid fa-cloud-arrow-down logo-icon"></i>
                <h1>Universal Video Downloader</h1>
                <p>Download videos seamlessly from YouTube, TikTok, Facebook, Instagram & more</p>
            </div>
            
            <div class="input-box">
                <i class="fa-solid fa-link input-icon"></i>
                <input type="text" id="videoUrl" placeholder="Paste your video link here...">
                <button onclick="downloadVideo()">
                    <span>Fetch Video</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div id="loading" class="loading-box hidden">
                <div class="spinner"></div>
                <p>Processing your link... Please wait</p>
            </div>

            <div id="result" class="result-box hidden">
                <i class="fa-solid fa-circle-check check-icon"></i>
                <h3>Your Video is Ready!</h3>
                <p id="videoTitle">Ready to download in high quality</p>
                <a id="downloadBtn" href="#" target="_blank" class="download-link">
                    <i class="fa-solid fa-download"></i> Download MP4
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
